<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="cardFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="1" stop-color="#f3ecd6"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd54a"/>
      <stop offset="0.5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e8a33f"/>
    </linearGradient>
    <linearGradient id="crownGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe98a"/>
      <stop offset="1" stop-color="#f5b83d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2ec9a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- توهج خلف البطاقة -->
  <ellipse cx="200" cy="205" rx="175" ry="185" fill="url(#glow)"/>

  <!-- البطاقة مائلة -->
  <g transform="rotate(-12 200 200)" filter="url(#shadow)">
    <!-- جسم البطاقة -->
    <rect x="85" y="42" width="230" height="320" rx="22" fill="url(#cardFace)"/>
    <!-- إطار ذهبي داخلي -->
    <rect x="100" y="57" width="200" height="290" rx="14" fill="none" stroke="url(#goldEdge)" stroke-width="4"/>
    <!-- بستوني كبير في النص -->
    <g transform="translate(200,215)">
      <path d="M0,-58 C14,-30 34,-18 34,6 C34,24 22,36 8,38 L22,58 L-22,58 L-8,38 C-22,36 -34,24 -34,6 C-34,-18 -14,-30 0,-58 Z"
            fill="#2a2a4a"/>
      <!-- شريط التاج داخل البستوني -->
      <path d="M-16,-16 L-26,-36 L-8,-24 L0,-40 L8,-24 L26,-36 L16,-16 Z" fill="url(#crownGold)"/>
    </g>
    <!-- بستوني صغير علوي -->
    <path d="M130,86 C138,104 150,110 150,124 C150,134 144,140 136,142 L144,152 L124,152 L132,142 C124,140 118,134 118,124 C118,110 122,104 130,86 Z"
          fill="#2a2a4a"/>
    <!-- بستوني صغير سفلي مقلوب -->
    <g transform="translate(270,262) rotate(180)">
      <path d="M0,-18 C4,-9 11,-6 11,2 C11,8 7,12 3,13 L7,19 L-7,19 L-3,13 C-7,12 -11,8 -11,2 C-11,-6 -4,-9 0,-18 Z"
            fill="#2a2a4a"/>
    </g>
  </g>
</svg>